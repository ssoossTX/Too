<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перенаправление - MMORPG Кликер</title>
  <script>
    // Перенаправляем на правильный URL
    window.location.href = './Too/';
  </script>
  <style>
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: sans-serif;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0 20px;
    }
    .container {
      max-width: 600px;
    }
    h1 {
      color: #38bdf8;
    }
    p {
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .loader {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #38bdf8;
      animation: spin 1s ease-in-out infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Перенаправление...</h1>
    <div class="loader"></div>
    <p>Вы будете автоматически перенаправлены на страницу игры.</p>
    <p>Если перенаправление не работает, <a href="./Too/" style="color: #38bdf8;">нажмите здесь</a>.</p>
  </div>
</body>
</html>
