<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMORPG Кликер</title>
  <meta name="description" content="Веб-игра MMORPG-кликер с системой классов, улучшений, экспедиций, подземелий и обширной коллекцией предметов">
  <link rel="stylesheet" href="./main.css">
</head>
<body>
  <div id="loading-screen">
    <div class="loading-container">
      <div class="loading-spinner"></div>
    </div>
    <div id="progress-text">Загрузка...</div>
  </div>

  <div id="root"></div>

  <script>
    localStorage.setItem('use_local_storage', 'true');
    console.log('GitHub Pages режим: данные сохраняются в localStorage браузера');
    
    let startTime = Date.now();
    let loadingProgress = 0;
    let loadComplete = false;
    
    function updateProgress() {
      if (!loadComplete) {
        loadingProgress += Math.random() * 10;
        if (loadingProgress > 98) loadingProgress = 98;
        
        const progressText = document.getElementById('progress-text');
        const timeElapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        
        if (progressText) progressText.textContent = `Загружено ${Math.round(loadingProgress)}% (${timeElapsed} сек)`;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setInterval(updateProgress, 500);
    });

    window.addEventListener('load', () => {
      loadComplete = true;
      const progressText = document.getElementById('progress-text');
      
      if (progressText) {
        const finalTime = ((Date.now() - startTime) / 1000).toFixed(1);
        progressText.textContent = `Загрузка завершена (${finalTime} сек)`;
      }
      
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
            document.getElementById('root').style.display = 'block';
          }, 500);
        }
      }, 500);
    });
  </script>
  <script src="./main.js" type="module"></script>
</body>
</html>
