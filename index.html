<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMORPG Кликер</title>
  <meta name="description" content="Веб-игра MMORPG-кликер с системой классов, улучшений, экспедиций, подземелий и обширной коллекцией предметов">
  
  <!-- Активация режима локального хранилища для GitHub Pages -->
  <script>
    // Включаем режим локального хранилища
    localStorage.setItem('use_local_storage', 'true');
    console.log('GitHub Pages режим: данные сохраняются в localStorage браузера');
    
    // Функция для проверки наличия данных игры
    function checkGameData() {
      const gameData = localStorage.getItem('mmorpg_clicker_game_state');
      if (gameData) {
        console.log('Обнаружены сохраненные данные игры');
      } else {
        console.log('Сохраненные данные не найдены, будет создана новая игра');
      }
    }
    
    // Проверяем данные при загрузке страницы
    window.addEventListener('DOMContentLoaded', checkGameData);
  </script>
  
  <!-- Стили будут добавлены при сборке -->
  <link rel="stylesheet" href="./assets/index.css">
  
  <!-- Font Awesome для иконок -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="root">
    <!-- Здесь будет отрендерено React-приложение -->
    <div class="loading-screen" style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; background-color: #1a1a2e;">
      <h1 style="font-size: 2rem; color: #fff; margin-bottom: 1rem;">MMORPG Кликер</h1>
      <div style="border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
      <p style="margin-top: 1rem; color: rgba(255, 255, 255, 0.7);">Загрузка игры...</p>
    </div>
  </div>
  
  <style>
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a1a2e;
      color: #fff;
    }
  </style>
  
  <!-- Скрипты будут добавлены при сборке -->
  <script type="module" src="./assets/index.js"></script>
</body>
</html>
