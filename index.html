
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMORPG Кликер</title>
  <meta name="description" content="Веб-игра MMORPG-кликер с системой классов, улучшений, экспедиций, подземелий и обширной коллекцией предметов">
  
  <!-- Активация режима локального хранилища для GitHub Pages -->
  <script>
    localStorage.setItem('use_local_storage', 'true');
    console.log('GitHub Pages режим: данные сохраняются в localStorage браузера');
    
    let startTime = Date.now();
    let loadingProgress = 0;
    let loadComplete = false;
    
    function updateProgress() {
      if (!loadComplete) {
        loadingProgress += Math.random() * 10;
        if (loadingProgress > 98) loadingProgress = 98;
        
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const timeElapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        
        if (progressBar) progressBar.style.width = loadingProgress + '%';
        if (progressText) progressText.textContent = `Загружено ${Math.round(loadingProgress)}% (${timeElapsed} сек)`;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setInterval(updateProgress, 500);
    });

    window.addEventListener('load', () => {
      loadComplete = true;
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      
      if (progressBar) progressBar.style.width = '100%';
      if (progressText) {
        const finalTime = ((Date.now() - startTime) / 1000).toFixed(1);
        progressText.textContent = `Загрузка завершена (${finalTime} сек)`;
      }
      
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          setTimeout(() => loadingScreen.style.display = 'none', 500);
        }
      }, 500);
    });
  </script>
  
  <style>
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1b26;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    
    .progress-container {
      width: 80%;
      max-width: 400px;
      background: #2a2b36;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
    }
    
    #progress-bar {
      width: 0%;
      height: 4px;
      background: #7957f3;
      transition: width 0.3s ease;
    }
    
    #progress-text {
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin-top: 10px;
    }
    
    .game-title {
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 24px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <h1 class="game-title">MMORPG Кликер</h1>
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div id="progress-text">Загрузка...</div>
  </div>
  
  <div id="root"></div>
</body>
</html>
