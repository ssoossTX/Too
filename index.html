
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMORPG Кликер</title>
  <meta name="description" content="Веб-игра MMORPG-кликер с системой классов, улучшений, экспедиций, подземелий и обширной коллекцией предметов">
  
  <!-- Активация режима локального хранилища для GitHub Pages -->
  <script>
    localStorage.setItem('use_local_storage', 'true');
    console.log('GitHub Pages режим: данные сохраняются в localStorage браузера');
    
    let startTime = Date.now();
    let loadingProgress = 0;
    
    function updateProgress() {
      loadingProgress += Math.random() * 15;
      if (loadingProgress > 95) loadingProgress = 95;
      
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      const timeElapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      
      if (progressBar) progressBar.style.width = loadingProgress + '%';
      if (progressText) progressText.textContent = `Загружено ${Math.round(loadingProgress)}% (${timeElapsed} сек)`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      setInterval(updateProgress, 500);
    });

    window.addEventListener('load', () => {
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      if (progressBar) progressBar.style.width = '100%';
      if (progressText) progressText.textContent = 'Загрузка завершена!';
    });
  </script>
  
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .progress-bar {
      width: 300px;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin: 20px auto;
    }
    .progress-bar-fill {
      height: 100%;
      background: #4f46e5;
      transition: width 0.5s ease;
      width: 0%;
    }
  </style>
  
  <link rel="stylesheet" href="./assets/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="root">
    <div class="loading-screen" style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; background-color: #1a1a2e;">
      <h1 style="font-size: 2rem; color: #fff; margin-bottom: 1rem;">MMORPG Кликер</h1>
      <div style="border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
      <div class="progress-bar">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>
      <p id="progress-text" style="margin-top: 0.5rem; color: rgba(255, 255, 255, 0.7);">Загрузка...</p>
    </div>
  </div>
  <script type="module" src="./assets/index.js"></script>
</body>
</html>
